[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xeno"
version = "7.10.1"
description = "The Python IOC app and build framework from outer space."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Lain Musgrove (lainproliant)", email = "lainproliant@gmail.com" }]
keywords = ["IOC", "dependency", "injector", "build", "system"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lainproliant/xeno"

[tool.setuptools.packages.find]
include = ["xeno*"]
